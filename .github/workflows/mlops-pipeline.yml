name: MLOps Evaluation & Retrieval Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mlops/**'
      - '.github/workflows/mlops-pipeline.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mlops/**'

jobs:
  mlops-quality-gate:
    name: Ingest, Index & Continuous Evaluation Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mlops/requirements.txt -r backend/requirements.txt

      - name: 'Stage 1-3: Run Medallion Data Pipeline'
        run: |
          python -m mlops.pipeline.run_pipeline --stage all

      - name: 'Stage 4: Run Continuous Evaluation Benchmark Gate'
        run: |
          python mlops/eval/evaluate_agent.py

      - name: Archive Gold Artifacts & Evaluation Report
        uses: actions/upload-artifact@v6
        with:
          name: gold-index-and-eval-report
          path: |
            mlops/data/gold/gold_index.json
            mlops/data/gold/manifest.json
            mlops/eval/eval_report.json
          retention-days: 14
